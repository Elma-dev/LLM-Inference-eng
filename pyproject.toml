[project]
name = "inference-engineering"
version = "0.1.0"
description = "Speculative Decoding Benchmark for LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "numpy>=1.24",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
